name: "Canvas: Mark-As Done Script"
description: "Update Canvas module item completion requirements for courses"
title: "Canvas: Mark-As Done"
labels:
  - automation
  - canvas
  - module-completion
body:
  - type: markdown
    attributes:
      value: |
        ## Add a job title
        
        Add the Course title or ID to name this job.

  - type: input
    id: job_title
    attributes:
      label: "Job Title"
      description: "Give this job a descriptive name"
      placeholder: "Canvas: Mark-As Done"
      value: "Canvas: Mark-As Done"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "Canvas Environment"
      description: "Select the Canvas environment you want to update. NOTE: Updating Prod will be a student/partner-facing action."
      options:
        - "Canvas Beta"
        - "Canvas Prod (student-facing)"
      default: 0
    validations:
      required: true

  - type: input
    id: course_ids
    attributes:
      label: "Course ID or IDs"
      description: "Enter a single Course ID, or a comma-separated list of Course IDs. The Course ID can be found in the Canvas URL of the course or courses you want updated."
      placeholder: "e.g., 39005, 39006, 45966, 27199"
    validations:
      required: true

  - type: checkboxes
    id: prod_confirmation
    attributes:
      label: "ATTENTION!"
      options:
        - label: 'If the PROD is checked above, I acknowledge that this action will update production pages in Canvas'
          required: false

  - type: markdown
    attributes:
      value: |
        ---
        
        ## Workflow Details
        
        This issue will trigger a GitHub Actions workflow that:
        1. Parses the course IDs and environment from this issue
        2. Creates a Kubernetes job in the specified environment
        3. Runs the `update_module_completion_requirements.py` script
        4. Updates module item completion requirements based on item type
        5. Comments back on this issue with the results
        6. Automatically closes this issue when complete
        
        **Script Behavior:**
        - **Assignment (no submission)**: Sets "must_mark_done"
        - **Assignment (with submission)**: Sets "must_submit"
        - **Quiz**: Sets "must_submit"
        - **Page**: Sets "must_mark_done"
        - **Discussion**: Sets "must_contribute"
        - **ExternalTool**: Sets "must_view"
        
        The script will retry up to 10 times for any items that fail to update on the first attempt.
