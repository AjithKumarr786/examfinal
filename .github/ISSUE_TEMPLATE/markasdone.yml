name: "Canvas: Mark-As Done Script"
description: "Update Canvas module item completion requirements for courses or account blueprint courses"
title: "Canvas: Mark-As Done"
labels:
  - module-completion
body:
  - type: markdown
    attributes:
        value: |
          Add the Course title or Account name to name this job

  - type: dropdown
    id: environment
    attributes:
      label: "Canvas Environment"
      description: "Select the Canvas environment you want to update. NOTE: Updating Prod will be a student/partner-facing action."
      options:
        - "Canvas Beta"
        - "Canvas Prod (student-facing)"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: target_type
    attributes:
      label: "Target Type"
      description: "Select whether you want to update specific courses or all blueprint courses in an account"
      options:
        - "Course"
        - "Account (Blueprint Courses Only)"
      default: 0
    validations:
      required: true

  - type: input
    id: course_ids
    attributes:
      label: "Course ID(s)"
      description: "Enter a single Course ID, or a comma-separated list of Course IDs. Only used if 'Course' is selected above."
      placeholder: "e.g., 39005, 39006, 45966, 27199"
    validations:
      required: false

  - type: input
    id: account_id
    attributes:
      label: "Account ID"
      description: "Enter a single Account ID. Only used if 'Account (Blueprint Courses Only)' is selected above. The script will process ALL blueprint courses in this account."
      placeholder: "e.g., 12345"
    validations:
      required: false

  - type: checkboxes
    id: prod_confirmation
    attributes:
      label: "ATTENTION!"
      options:
        - label: 'If PROD is checked above, I acknowledge that this action will update production pages in Canvas'
          required: true
