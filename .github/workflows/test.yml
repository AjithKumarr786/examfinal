name: "[DEPLOY][STG] Async Content Player"
run-name: "stg/${{ inputs.job_mode }} @ ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      job_mode:
        description: "Deployment mode"
        required: true
        type: choice
        default: build-and-deploy
        options:
          - build-only
          - build-and-deploy
          - deploy-only
      image_tag:
        description: "Optional image tag to deploy (if empty, a branch-based tag is generated and built)"
        required: false
        type: string

env:
  APP_NAME: async-content-player
  ENVIRONMENT: stg
  AWS_REGION: us-west-2
  AWS_ACCOUNT_NAME: degrees-prod
  AWS_ACCOUNT_ID: "823386275404"
  EKS_CLUSTER_NAME: main-stg
  ECR_BASE: 127579856528.dkr.ecr.us-west-2.amazonaws.com
  IMAGE_PREFIX: atrio
  NAMESPACE: academic-product
  RUN_PRE_UPGRADE_JOB: "false"

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.plan.outputs.image_tag }}
      should_build: ${{ steps.plan.outputs.should_build }}
      should_deploy: ${{ steps.plan.outputs.should_deploy }}
      effective_job_mode: ${{ steps.plan.outputs.effective_job_mode }}
      full_image: ${{ steps.plan.outputs.full_image }}
      mode_note: ${{ steps.plan.outputs.mode_note }}
    steps:
      - name: Determine execution plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ github.ref_name }}"
          REQUESTED_MODE="${{ inputs.job_mode }}"
          IMAGE_TAG_INPUT="${{ inputs.image_tag }}"

          SHOULD_BUILD="false"
          SHOULD_DEPLOY="false"
          EFFECTIVE_MODE="$REQUESTED_MODE"
          MODE_NOTE=""

          if [[ -n "$IMAGE_TAG_INPUT" ]]; then
            FINAL_TAG="$IMAGE_TAG_INPUT"
          else
            DATE="$(date +%Y%m%d-%H%M%S)"
            MAX_BRANCH_LEN=$((128 - 7 - 1 - ${#DATE}))
            if (( MAX_BRANCH_LEN < 1 )); then MAX_BRANCH_LEN=1; fi
            SANITIZED_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g' | cut -c1-"$MAX_BRANCH_LEN")
            FINAL_TAG="branch-${SANITIZED_BRANCH}-${DATE}"
          fi

          case "$REQUESTED_MODE" in
            build-only)
              SHOULD_BUILD="true"
              SHOULD_DEPLOY="false"
              ;;
            build-and-deploy)
              SHOULD_BUILD="true"
              SHOULD_DEPLOY="true"
              ;;
            deploy-only)
              SHOULD_DEPLOY="true"
              if [[ -z "$IMAGE_TAG_INPUT" ]]; then
                SHOULD_BUILD="true"
                EFFECTIVE_MODE="build-and-deploy"
                MODE_NOTE="No image_tag provided for deploy-only; switched to build-and-deploy so a branch image can be deployed."
              fi
              ;;
            *)
              echo "Unsupported job mode: $REQUESTED_MODE"
              exit 1
              ;;
          esac

          FULL_IMAGE="${{ env.ECR_BASE }}/${{ env.IMAGE_PREFIX }}/${{ env.APP_NAME }}:${FINAL_TAG}"

          {
            echo "image_tag=$FINAL_TAG"
            echo "should_build=$SHOULD_BUILD"
            echo "should_deploy=$SHOULD_DEPLOY"
            echo "effective_job_mode=$EFFECTIVE_MODE"
            echo "full_image=$FULL_IMAGE"
            echo "mode_note=$MODE_NOTE"
          } >> "$GITHUB_OUTPUT"

          echo "Execution plan"
          echo "=============="
          echo "Branch: $BRANCH"
          echo "Requested mode: $REQUESTED_MODE"
          echo "Effective mode: $EFFECTIVE_MODE"
          echo "Image tag: $FINAL_TAG"
          echo "Image: $FULL_IMAGE"
          echo "Build: $SHOULD_BUILD"
          echo "Deploy: $SHOULD_DEPLOY"
          if [[ -n "$MODE_NOTE" ]]; then
            echo "Note: $MODE_NOTE"
          fi

  build-image:
    needs: validate-inputs
    if: needs.validate-inputs.outputs.should_build == 'true'
    runs-on: 2uinc-mgmt
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.validate-inputs.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: 2uinc/gha-workflows/.github/actions/assume_repo_role@main
        with:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCOUNT_NAME: ${{ env.AWS_ACCOUNT_NAME }}

      - name: Build Docker image
        shell: bash
        run: make docker-build

      - name: Push Docker image
        shell: bash
        run: make docker-push

  deploy:
    needs: [validate-inputs, build-image]
    if: |
      always() &&
      needs.validate-inputs.result == 'success' &&
      needs.validate-inputs.outputs.should_deploy == 'true' &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped')
    runs-on: 2uinc-mgmt
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.validate-inputs.outputs.image_tag }}
      CLUSTER: ${{ env.EKS_CLUSTER_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: 2uinc/gha-workflows/.github/actions/assume_repo_role@main
        with:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCOUNT_NAME: ${{ env.AWS_ACCOUNT_NAME }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Ensure helm3 command is available
        shell: bash
        run: |
          if command -v helm3 >/dev/null 2>&1; then
            helm3 version
            exit 0
          fi

          if ! command -v helm >/dev/null 2>&1; then
            echo "Neither helm3 nor helm is available."
            exit 1
          fi

          mkdir -p "$HOME/bin"
          ln -sf "$(command -v helm)" "$HOME/bin/helm3"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/helm3" version

      - name: Configure kubeconfig for cluster
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          aws eks update-kubeconfig \
            --name "${CLUSTER}" \
            --region "${{ env.AWS_REGION }}" \
            --kubeconfig "$HOME/.kube/${CLUSTER}"

      - name: Deploy with Helm via Makefile target
        shell: bash
        run: |
          ENVIRONMENT="${{ env.ENVIRONMENT }}" \
          CLUSTER="${CLUSTER}" \
          IMAGE_TAG="${IMAGE_TAG}" \
          RUN_PRE_UPGRADE_JOB="${{ env.RUN_PRE_UPGRADE_JOB }}" \
          make deploy

      - name: Rollout status
        shell: bash
        run: |
          KUBECONFIG="$HOME/.kube/${CLUSTER}" \
          kubectl rollout status deployment/${{ env.APP_NAME }}-${{ env.ENVIRONMENT }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=5m

      - name: Verify deployed resources
        shell: bash
        run: |
          KUBECONFIG="$HOME/.kube/${CLUSTER}" kubectl get deployment/${{ env.APP_NAME }}-${{ env.ENVIRONMENT }} -n ${{ env.NAMESPACE }}
          KUBECONFIG="$HOME/.kube/${CLUSTER}" kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=${{ env.APP_NAME }}

  summary:
    needs: [validate-inputs, build-image, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Workflow Summary
        shell: bash
        run: |
          {
            echo "# STG Deploy Summary"
            echo ""
            echo "## Configuration"
            echo "- App: ${{ env.APP_NAME }}"
            echo "- Environment: ${{ env.ENVIRONMENT }}"
            echo "- Cluster: ${{ env.EKS_CLUSTER_NAME }}"
            echo "- Requested Mode: ${{ inputs.job_mode }}"
            echo "- Effective Mode: ${{ needs.validate-inputs.outputs.effective_job_mode }}"
            echo "- Image: ${{ needs.validate-inputs.outputs.full_image }}"
            echo "- Branch: ${{ github.ref_name }}"
            if [[ -n "${{ needs.validate-inputs.outputs.mode_note }}" ]]; then
              echo "- Note: ${{ needs.validate-inputs.outputs.mode_note }}"
            fi
            echo ""
            echo "## Job Results"
            echo "- Validate: ${{ needs.validate-inputs.result }}"
            echo "- Build: ${{ needs.build-image.result }}"
            echo "- Deploy: ${{ needs.deploy.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
